<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليمون — دليل العروض والأصناف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1e8a3c; --brand-dark:#14632a; --brand-on:#ffffff; --accent:#14632a;
  --hdr1:#0d4d20; --hdr2:#27a047;
  --yellow:#ffc61a; --yellow-soft:#fff3c4;
  --bg:#f4f7f1; --card:#ffffff; --line:#e2e9dc; --row-alt:#fafcf8;
  --text:#1d2a1e; --muted:#6b7a6c;
  --red:#c0392b; --red-bg:#fdecea; --amber:#9a6a00; --amber-bg:#fff4d6;
  --ok-bg:#e5f4e8; --ok-tx:#14632a;
  --radius:14px;
  --shadow:0 1px 3px rgba(20,60,25,.08),0 4px 14px rgba(20,60,25,.05);
}
[data-theme="dark"]{
  --brand:#ffc61a; --brand-dark:#16407c; --brand-on:#0a1a30; --accent:#ffd94d;
  --hdr1:#081426; --hdr2:#16407c;
  --yellow:#ffc61a; --yellow-soft:#1d3355;
  --bg:#0a1424; --card:#101f38; --line:#1f3a5c; --row-alt:#0d1c31;
  --text:#e9eff8; --muted:#93a7c4;
  --red:#ff9d94; --red-bg:#3d1a24; --amber:#ffd94d; --amber-bg:#3a2f10;
  --ok-bg:#12325e; --ok-tx:#a9d3ff;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;transition:background .2s,color .2s}
/* ---------- header ---------- */
header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;position:relative;overflow:hidden}
header::after{content:'';position:absolute;inset-inline-end:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,198,26,.22)}
header::before{content:'';position:absolute;inset-inline-end:90px;bottom:-110px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hwrap{max-width:1180px;margin:0 auto;padding:16px 16px 18px;position:relative;z-index:1}
.topctl{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.ctl{border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.ctl:hover{background:rgba(255,255,255,.25)}
.brand{display:flex;align-items:center;gap:12px}
.logo{background:var(--yellow);color:#0d4d20;font-weight:700;font-size:22px;padding:4px 16px 7px;border-radius:999px;letter-spacing:-.3px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
[data-theme="dark"] .logo{color:#0a1a30}
.brand small{display:block;font-size:12px;opacity:.85;font-weight:500}
.brand h1{font-size:21px;font-weight:700;line-height:1.25}
.hwrap p.sub{margin-top:8px;font-size:13.5px;opacity:.92;max-width:640px}
/* ---------- tabs ---------- */
.tabbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabbar .inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabbar .inner::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.tab .cnt{background:var(--bg);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;border-radius:999px;padding:0 8px;line-height:1.7}
.tab:hover{border-color:var(--brand)}
.tab.active{background:var(--brand);border-color:var(--brand);color:var(--brand-on);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.tab.active .cnt{background:rgba(127,127,127,.25);border-color:transparent;color:inherit}
/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
section{display:none}
section.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat .num{font-size:24px;font-weight:700;color:var(--accent);line-height:1.2}
.stat .num.warn{color:var(--amber)} .stat .num.bad{color:var(--red)}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
/* ---------- controls ---------- */
.controls{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.search:focus-within{border-color:var(--brand);background:var(--card)}
.search svg{flex:0 0 auto;opacity:.55}
.search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;width:100%;color:var(--text)}
select.f{font-family:inherit;font-size:14px;font-weight:500;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;max-width:210px;color:var(--text);cursor:pointer}
select.f:focus{border-color:var(--brand);outline:none;background:var(--card)}
/* ---------- table ---------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;max-height:72vh}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
thead th{position:sticky;top:0;background:var(--brand-dark);color:#fff;font-weight:600;text-align:start;padding:10px 12px;white-space:nowrap;z-index:2}
tbody td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:var(--row-alt)}
tbody tr:hover{background:var(--yellow-soft)}
td.code{font-weight:700;color:var(--accent);white-space:nowrap;direction:ltr;text-align:left}
td.name{font-weight:500;min-width:220px}
td.num{white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok-tx)}
.badge.soon{background:var(--amber-bg);color:var(--amber)}
.badge.exp{background:var(--red-bg);color:var(--red)}
.badge.plain{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.offer-txt{font-weight:700;color:var(--accent)}
.more{display:block;margin:14px auto 0;background:var(--brand);color:var(--brand-on);border:none;font-family:inherit;font-size:14.5px;font-weight:600;padding:10px 26px;border-radius:999px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.count-line{font-size:13px;color:var(--muted);margin:8px 2px;font-weight:500}
.empty{padding:38px 16px;text-align:center;color:var(--muted);font-weight:500}
.loading{padding:38px 16px;text-align:center;color:var(--muted)}
.spin{width:30px;height:30px;border:3.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- master cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.mcard h3{font-size:16px;font-weight:700;color:var(--accent)}
.mcard .tf{font-size:13px;color:var(--muted);font-weight:500}
.mcard a{margin-top:auto;background:var(--yellow);color:#0a1a30;text-decoration:none;font-weight:700;font-size:14px;text-align:center;padding:8px;border-radius:10px}
.mcard a:hover{filter:brightness(.96)}
footer{max-width:1180px;margin:0 auto;padding:0 16px 26px;color:var(--muted);font-size:12.5px;text-align:center}
@media (max-width:560px){
  .brand h1{font-size:18px} .logo{font-size:19px}
  table{font-size:13.5px} td.name{min-width:170px}
  select.f{max-width:160px;flex:1 1 140px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="topctl">
      <button class="ctl" id="langBtn" onclick="toggleLang()"></button>
      <button class="ctl" id="themeBtn" onclick="toggleTheme()"></button>
    </div>
    <div class="brand">
      <span class="logo" id="logoTxt">ليمون</span>
      <div>
        <h1 id="ttl">دليل العروض والأصناف</h1>
        <small>Lemon Pharmacies — Offers, IPL &amp; Master Files</small>
      </div>
    </div>
    <p class="sub" id="sub"></p>
  </div>
</header>

<nav class="tabbar"><div class="inner" id="tabs"></div></nav>

<main id="main">
  <section id="sec-master"></section>
  <section id="sec-offers"></section>
  <section id="sec-ipl"></section>
  <section id="sec-contest"></section>
</main>

<footer><span id="foot"></span> <span id="upd">…</span></footer>

<script>
/* ضع رابط سكربت جوجل هنا بعد النشر — اتركه فارغًا للمعاينة المحلية */
const API = 'https://script.google.com/macros/s/AKfycbxcpNFnjaSiJPs8kNPhB8yE3kni_dgSsZhu3tJHt8r7zHevovRSnGxFeJmx_yQkJj1pTw/exec';
const PAGE_SIZE = 150;

const I18N = {
  ar: {
    title:'دليل العروض والأصناف', logo:'ليمون', langBtn:'English',
    sub:'مرجع واحد لكل الفريق: العروض النشطة، أصناف IPL، والمسابقات — البيانات تُحدَّث مباشرة من الملف الرئيسي.',
    foot:'صيدليات ليمون — صفحة مرجعية للقراءة والبحث فقط · آخر تحديث للبيانات:',
    tabs:{master:'الملفات الرئيسية', offers:'العروض', ipl:'IPL', contest:'المسابقات'},
    searchPh:'ابحث برقم الصنف أو اسمه…', all:'الكل',
    fStatus:'الحالة', fClass:'الكلاس', fCtg:'CTG',
    loading:'جارٍ تحميل البيانات…', loadErr:'تعذّر تحميل البيانات — حاول تحديث الصفحة.',
    empty:'لا توجد نتائج مطابقة لبحثك.', openFile:'فتح الملف',
    countLine:(a,b)=>`عرض ${a} من ${b} نتيجة`,
    more:n=>`عرض المزيد (${n} متبقٍ)`,
    stMasterFiles:'ملف / رابط رئيسي',
    stActiveOffers:'عرض نشط الآن', stExpiredOffers:'عرض منتهٍ', stTotalOffers:'إجمالي العروض',
    stActiveContests:'مسابقة جارية', stExpiredContests:'منتهية', stTotalContests:'إجمالي المسابقات',
    stIplItems:'صنف في IPL', stClasses:'كلاس', stStatuses:'حالة',
    col:{code:'الكود', item:'الصنف', offer:'العرض', from:'من', to:'إلى', left:'المتبقي',
         contest:'المسابقة', limit:'الحد', cls:'الكلاس', rate:'RATE', ctg:'CTG', status:'الحالة'},
    badge:n=>{ if(isNaN(n)) return '<span class="badge plain">—</span>';
      if(n<0) return `<span class="badge exp">منتهي منذ ${-n} يوم</span>`;
      if(n===0) return '<span class="badge soon">ينتهي اليوم</span>';
      if(n<=7) return `<span class="badge soon">باقي ${n} يوم</span>`;
      return `<span class="badge ok">باقي ${n} يوم</span>`; },
    updLocale:'ar-EG',
  },
  en: {
    title:'Offers & Items Guide', logo:'Lemon', langBtn:'العربي',
    sub:'One reference for the whole team: active offers, IPL items and contests — data updates live from the master file.',
    foot:'Lemon Pharmacies — read-only reference page · Data last updated:',
    tabs:{master:'Master Files', offers:'Offers', ipl:'IPL', contest:'Contests'},
    searchPh:'Search by item code or name…', all:'All',
    fStatus:'Status', fClass:'Class', fCtg:'CTG',
    loading:'Loading data…', loadErr:"Couldn't load data — try refreshing the page.",
    empty:'No results match your search.', openFile:'Open file',
    countLine:(a,b)=>`Showing ${a} of ${b} results`,
    more:n=>`Show more (${n} left)`,
    stMasterFiles:'Master files / links',
    stActiveOffers:'Active offers', stExpiredOffers:'Expired offers', stTotalOffers:'Total offers',
    stActiveContests:'Running contests', stExpiredContests:'Ended', stTotalContests:'Total contests',
    stIplItems:'IPL items', stClasses:'Classes', stStatuses:'Statuses',
    col:{code:'Code', item:'Item', offer:'Offer', from:'From', to:'To', left:'Remaining',
         contest:'Contest', limit:'Limitation', cls:'Class', rate:'RATE', ctg:'CTG', status:'Status'},
    badge:n=>{ if(isNaN(n)) return '<span class="badge plain">—</span>';
      if(n<0) return `<span class="badge exp">Ended ${-n}d ago</span>`;
      if(n===0) return '<span class="badge soon">Ends today</span>';
      if(n===1) return '<span class="badge soon">1 day left</span>';
      if(n<=7) return `<span class="badge soon">${n} days left</span>`;
      return `<span class="badge ok">${n} days left</span>`; },
    updLocale:'en-GB',
  }
};
let lang = localStorage.getItem('lh_lang') || 'ar';
const T = () => I18N[lang];
let theme = localStorage.getItem('lh_theme') || 'light';

const TAB_DEFS = ['master','offers','ipl','contest'];
const S = {};
TAB_DEFS.forEach(id => S[id] = { loaded:false, loading:false, rows:[], shown:PAGE_SIZE, q:'', f:{} });
let activeTab = 'offers';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){ return String(s ?? '').toLowerCase()
  .replace(/[ً-ٟ]/g,'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim(); }
const MONTHS = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
function fmtDate(v){
  const m = String(v||'').trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/);
  if(!m) return v || '';
  const y = m[3].length===2 ? '20'+m[3] : m[3];
  return `${m[1].padStart(2,'0')}/${MONTHS[m[2].toLowerCase()]||'??'}/${y}`;
}
const isExp = r => { const n = parseInt(r['End After'],10); return !isNaN(n) && n < 0; };
const daysBadge = v => T().badge(parseInt(v,10));

/* ---------- theme & language ---------- */
const MOON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
const SUN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>';
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  $('#themeBtn').innerHTML = (theme==='dark' ? SUN : MOON) + (lang==='ar' ? (theme==='dark'?'الوضع النهاري':'الوضع الليلي') : (theme==='dark'?'Day mode':'Night mode'));
}
function toggleTheme(){ theme = theme==='dark' ? 'light' : 'dark'; localStorage.setItem('lh_theme', theme); applyTheme(); }
function applyLang(){
  const t = T();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.title = (lang==='ar' ? 'ليمون — ' : 'Lemon — ') + t.title;
  $('#ttl').textContent = t.title; $('#logoTxt').textContent = t.logo;
  $('#sub').textContent = t.sub; $('#foot').textContent = t.foot;
  $('#langBtn').textContent = t.langBtn;
  buildTabs();
  TAB_DEFS.forEach(id => { if (S[id].loaded){ buildSection(id); render(id); } });
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab===activeTab));
  applyTheme();
}
function toggleLang(){
  lang = lang==='ar' ? 'en' : 'ar';
  localStorage.setItem('lh_lang', lang);
  applyLang();
}

/* ---------- tabs ---------- */
function buildTabs(){
  $('#tabs').innerHTML = TAB_DEFS.map(id =>
    `<button class="tab ${id===activeTab?'active':''}" data-tab="${id}" onclick="activate('${id}')">${T().tabs[id]}<span class="cnt" id="cnt-${id}">${S[id].loaded ? S[id].rows.length.toLocaleString('en-US') : '…'}</span></button>`).join('');
}
function activate(id){
  activeTab = id;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('active', s.id==='sec-'+id));
  load(id);
}

/* ---------- data ---------- */
async function load(id){
  const st = S[id];
  if (st.loaded || st.loading) { if(st.loaded) render(id); return; }
  st.loading = true;
  const sec = $('#sec-'+id);
  sec.innerHTML = `<div class="loading"><div class="spin"></div>${T().loading}</div>`;
  try{
    const url = API ? `${API}?tab=${id}` : `data/${id}.json`;
    const res = await fetch(url);
    const data = await res.json();
    st.rows = data.rows || [];
    st.loaded = true;
    if (data.updated) $('#upd').textContent = new Date(data.updated).toLocaleString(T().updLocale);
    const c = $('#cnt-'+id); if (c) c.textContent = st.rows.length.toLocaleString('en-US');
    buildSection(id);
    render(id);
  }catch(err){
    sec.innerHTML = `<div class="empty">${T().loadErr}</div>`;
  }
  st.loading = false;
}

/* ---------- section skeletons ---------- */
function statsHtml(items){
  return `<div class="stats">${items.map(i=>`<div class="stat"><div class="num ${i.cls||''}">${i.num}</div><div class="lbl">${i.lbl}</div></div>`).join('')}</div>`;
}
function controlsHtml(id, opts){
  const st = S[id], t = T();
  let h = `<div class="controls">
    <label class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="${t.searchPh}" value="${esc(st.q)}" oninput="S['${id}'].q=this.value;S['${id}'].shown=${PAGE_SIZE};render('${id}')">
    </label>`;
  (opts.filters||[]).forEach(f=>{
    const vals = [...new Set(st.rows.map(r=>String(r[f.key]||'').trim()).filter(Boolean))].sort();
    h += `<select class="f" onchange="S['${id}'].f['${f.key}']=this.value;S['${id}'].shown=${PAGE_SIZE};render('${id}')">
      <option value="">${f.label}: ${t.all}</option>${vals.map(v=>`<option ${st.f[f.key]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`;
  });
  return h + `</div><div id="body-${id}"></div>`;
}

function buildSection(id){
  const st = S[id], sec = $('#sec-'+id), rows = st.rows, t = T();
  if (id==='master'){
    sec.innerHTML = statsHtml([{num:rows.length, lbl:t.stMasterFiles}]) +
      `<div class="cards">${rows.map(r=>`
        <div class="mcard"><h3>${esc(r['Name'])}</h3>
        <div class="tf">${esc(r['Time Frame']||'')}</div>
        <a href="${esc(r['Link'])}" target="_blank" rel="noopener">${t.openFile}</a></div>`).join('')}</div>`;
    return;
  }
  if (id==='offers'){
    const act = rows.filter(r=>!isExp(r)), exp = rows.length-act.length;
    sec.innerHTML = statsHtml([
      {num:act.length, lbl:t.stActiveOffers},
      {num:exp, cls:'bad', lbl:t.stExpiredOffers},
      {num:rows.length, lbl:t.stTotalOffers},
    ]) + controlsHtml(id, {});
    return;
  }
  if (id==='contest'){
    const act = rows.filter(r=>!isExp(r)), exp = rows.length-act.length;
    sec.innerHTML = statsHtml([
      {num:act.length, lbl:t.stActiveContests},
      {num:exp, cls:'bad', lbl:t.stExpiredContests},
      {num:rows.length, lbl:t.stTotalContests},
    ]) + controlsHtml(id, {filters:[{key:'Class Name', label:t.fClass}]});
    return;
  }
  if (id==='ipl'){
    const classes = new Set(rows.map(r=>r['CLASS_NAME']).filter(Boolean)).size;
    const statuses = new Set(rows.map(r=>r['STATUS']).filter(Boolean)).size;
    sec.innerHTML = statsHtml([
      {num:rows.length.toLocaleString('en-US'), lbl:t.stIplItems},
      {num:classes, lbl:t.stClasses},
      {num:statuses, lbl:t.stStatuses},
    ]) + controlsHtml(id, {filters:[{key:'STATUS', label:t.fStatus},{key:'CLASS_NAME', label:t.fClass},{key:'CTG', label:t.fCtg}]});
    return;
  }
}

/* ---------- filtering + tables ---------- */
function filtered(id){
  const st = S[id];
  let rows = st.rows.slice();
  Object.entries(st.f).forEach(([k,v])=>{ if(v) rows = rows.filter(r=>String(r[k]||'').trim()===v); });
  const q = norm(st.q);
  if (q) rows = rows.filter(r => norm(Object.values(r).join(' ')).includes(q));
  if (id==='offers'||id==='contest') rows.sort((a,b)=>{
    const ea=isExp(a)?1:0, eb=isExp(b)?1:0;
    if (ea!==eb) return ea-eb; // المنتهية في الآخر
    const na=parseInt(a['End After'],10), nb=parseInt(b['End After'],10);
    return (isNaN(na)?1e9:na)-(isNaN(nb)?1e9:nb);
  });
  return rows;
}
function cols(id){
  const c = T().col;
  if (id==='offers') return [
    {k:'itemcode', l:c.code, cls:'code'}, {k:'item name', l:c.item, cls:'name'},
    {k:'OFFER', l:c.offer, fmt:v=>`<span class="offer-txt">${esc(v)}</span>`},
    {k:'FROM', l:c.from, cls:'num', fmt:v=>fmtDate(v)}, {k:'TO', l:c.to, cls:'num', fmt:v=>fmtDate(v)},
    {k:'End After', l:c.left, fmt:v=>daysBadge(v)} ];
  if (id==='contest') return [
    {k:'itemcode', l:c.code, cls:'code'}, {k:'item name', l:c.item, cls:'name'},
    {k:'Contest', l:c.contest, fmt:v=>`<span class="offer-txt">${esc(v)}</span>`},
    {k:'LIMITATION', l:c.limit}, {k:'Class Name', l:c.cls},
    {k:'FROM', l:c.from, cls:'num', fmt:v=>fmtDate(v)}, {k:'TO', l:c.to, cls:'num', fmt:v=>fmtDate(v)},
    {k:'End After', l:c.left, fmt:v=>daysBadge(v)} ];
  if (id==='ipl') return [
    {k:'ITEM_CODE', l:c.code, cls:'code'}, {k:'ITEM_NAME', l:c.item, cls:'name'},
    {k:'RATE', l:c.rate, cls:'num'}, {k:'CTG', l:c.ctg},
    {k:'STATUS', l:c.status, fmt:v=>`<span class="badge plain">${esc(v)}</span>`},
    {k:'CLASS_NAME', l:c.cls} ];
  return [];
}
function render(id){
  if (id==='master') return;
  const st = S[id], body = $('#body-'+id), t = T();
  if (!body) return;
  const rows = filtered(id);
  const show = rows.slice(0, st.shown);
  const cs = cols(id);
  let h = `<div class="count-line">${t.countLine(show.length.toLocaleString('en-US'), rows.length.toLocaleString('en-US'))}</div>`;
  if (!rows.length){ body.innerHTML = h + `<div class="tblwrap"><div class="empty">${t.empty}</div></div>`; return; }
  h += `<div class="tblwrap"><table><thead><tr>${cs.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead><tbody>`;
  h += show.map(r=>`<tr>${cs.map(c=>`<td class="${c.cls||''}">${c.fmt?c.fmt(r[c.k]):esc(r[c.k])}</td>`).join('')}</tr>`).join('');
  h += `</tbody></table></div>`;
  if (rows.length > st.shown) h += `<button class="more" onclick="S['${id}'].shown+=${PAGE_SIZE};render('${id}')">${t.more((rows.length-st.shown).toLocaleString('en-US'))}</button>`;
  body.innerHTML = h;
}

/* ---------- init ---------- */
applyLang();
activate('offers');
['master','ipl','contest'].forEach(id=>load(id));
</script>
</body>
</html>
